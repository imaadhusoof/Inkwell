appId: com.inkwell.app
productName: Inkwell
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
